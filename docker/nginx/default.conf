# Okwe web — nginx server for the static Next.js export (./out).
#
# nginx does not inherit add_header directives into a location that sets its own,
# so every location that adds a header also includes the security headers snippet.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Behind a proxy the container port (8080) must never leak into redirects.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript text/javascript application/json application/xml image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;

    # Liveness probe for Docker and the load balancer.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Next.js emits content-hashed file names under /_next/static, so these can
    # be cached forever.
    location ^~ /_next/static/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Photos are generated by `npm run images` with a content hash in the file
    # name, so they can be cached forever too. The favicon is not hashed.
    location = /okwe-image/favicon.svg {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }
    location ^~ /okwe-image/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # HTML and the RSC payloads (*.txt, used for client-side navigation) must
    # always be revalidated so new deploys are picked up.
    location ~* \.(html|txt)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Static export routing: /contact → contact.html, / → index.html.
    # Unknown paths get Next's 404 page with a real 404 status.
    error_page 404 /404.html;
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html $uri/index.html =404;
    }
}
