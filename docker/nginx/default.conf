# Okwe web — nginx server for the static Redwood build (web/dist).
#
# nginx does not inherit add_header directives into a location that sets its own,
# so every location that adds a header also includes the security headers snippet.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Behind a proxy the container port (8080) must never leak into redirects.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;

    # Liveness probe for Docker and the load balancer.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite emits content-hashed file names, so these can be cached forever.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The HTML shell must always be revalidated so new deploys are picked up.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location = /200.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # SPA fallback: client-side routes (/contact, ...) are served Redwood's 200.html.
    location / {
        try_files $uri $uri/ /200.html;
    }
}
