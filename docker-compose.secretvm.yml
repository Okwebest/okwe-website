# Okwe — SecretVM deployment (https://okwebest.com)
#
# Upload this file in the SecretVM portal (see: ./scripts/docker/secretvm.sh show).
# The web image is pinned by digest by ./scripts/docker/build-push.sh; do not deploy
# a tag. The site needs no environment file.
#
# Traefik terminates TLS with the certificates SecretVM provides in /mnt/secure/cert
# and routes to the web container through its file provider: there is a single,
# static backend, so Traefik does not need the Docker socket.
#
# Routing is catch-all: the site answers on any hostname that reaches the VM, so
# it works on the VM's *.vm.scrtlabs.com name before okwebest.com is live. TLS is
# only valid for the names the SecretVM certificate covers (okwebest.com once the
# custom domain is set up); www.okwebest.com needs a certificate that includes it.

services:
  web:
    image: docker.io/privexlabs/okwe-web:unreleased
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  traefik:
    image: traefik:v3.7
    restart: unless-stopped
    command:
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --providers.file.directory=/etc/traefik/dynamic
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /mnt/secure/cert:/certs:ro
    configs:
      - source: tls
        target: /etc/traefik/dynamic/tls.yml
      - source: routes
        target: /etc/traefik/dynamic/routes.yml
    depends_on:
      - web
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

configs:
  tls:
    content: |
      tls:
        stores:
          default:
            defaultCertificate:
              certFile: /certs/secret_vm_fullchain.pem
              keyFile: /certs/secret_vm_private.pem
  routes:
    content: |
      http:
        routers:
          okwe:
            # Catch-all: every hostname (see the header comment).
            rule: PathPrefix(`/`)
            entryPoints:
              - websecure
            service: okwe-web
            middlewares:
              - hsts
            tls: {}
        middlewares:
          hsts:
            headers:
              stsSeconds: 31536000
        services:
          okwe-web:
            loadBalancer:
              servers:
                - url: http://web:8080
