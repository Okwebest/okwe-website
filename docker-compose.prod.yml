# Okwe — production on any Docker host. TLS is terminated upstream (your proxy or
# load balancer); this container serves plain HTTP on OKWE_PROD_PORT.
#
# Usage: ./scripts/docker/prod.sh up   (or: docker compose -f docker-compose.prod.yml up -d)
#
# The image is pinned by digest by ./scripts/docker/build-push.sh. To run an
# image that has not been pinned yet (e.g. a local build), set OKWE_WEB_IMAGE.

name: okwe

services:
  web:
    image: ${OKWE_WEB_IMAGE:-docker.io/privexlabs/okwe-web:unreleased}
    ports:
      - "${OKWE_PROD_PORT:-8080}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
